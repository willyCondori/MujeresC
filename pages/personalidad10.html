<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolución de Comunicación - #MujeresConPoder</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/chart.css">
</head>
<body class="page-container">

    <main class="main-card chart-view">
        <div class="form-header">
            <h1>Completar formulario <br><span class="highlight">#MujeresConPoder</span></h1>
            <h2 class="chart-title">La comunicación es una habilidad que se puede entrenar.</h2>
        </div>

        <!-- Contenedor del Gráfico Vectorial HTML/SVG -->
        <div class="chart-wrapper">
            <svg class="line-chart" viewBox="0 0 320 180" preserveAspectRatio="none">
                <!-- Líneas de cuadrícula horizontales -->
                <line x1="30" y1="20" x2="310" y2="20" stroke="#e5e7eb" stroke-dasharray="3,3" />
                <line x1="30" y1="60" x2="310" y2="60" stroke="#e5e7eb" stroke-dasharray="3,3" />
                <line x1="30" y1="100" x2="310" y2="100" stroke="#e5e7eb" stroke-dasharray="3,3" />
                <line x1="30" y1="140" x2="310" y2="140" stroke="#e5e7eb" stroke-dasharray="3,3" />

                <!-- Etiquetas del eje Y -->
                <text x="5" y="24" font-size="9" fill="#9ca3af">100%</text>
                <text x="5" y="64" font-size="9" fill="#9ca3af">75%</text>
                <text x="5" y="104" font-size="9" fill="#9ca3af">50%</text>
                <text x="5" y="144" font-size="9" fill="#9ca3af">25%</text>

                <!-- Curva 1: Naranja (Habilidades sociales) -->
                <path d="M 30 140 C 80 140, 120 130, 160 100 C 180 80, 185 80, 190 70" fill="none" stroke="#f97316" stroke-width="2.5" />
                
                <!-- Curva 2: Azul (Confianza) -->
                <path d="M 30 140 C 90 140, 110 80, 160 100 C 210 120, 240 50, 260 52" fill="none" stroke="#3b82f6" stroke-width="2.5" />
                
                <!-- Curva 3: Verde (Respeto) -->
                <path d="M 30 140 C 100 125, 140 130, 190 115 C 240 100, 260 125, 280 110" fill="none" stroke="#10b981" stroke-width="2.5" />

                <!-- Puntos Clave Finales y Etiquetas flotantes (Tooltips estilo burbuja) -->
                <!-- Naranja -->
                <circle cx="190" cy="70" r="4" fill="#f97316" />
                <g transform="translate(145, 38)">
                    <rect width="75" height="22" rx="4" fill="#f97316" />
                    <text x="37" y="14" font-size="9" fill="#fff" text-anchor="middle" font-weight="600">Habilidades</text>
                </g>

                <!-- Azul -->
                <circle cx="260" cy="52" r="4" fill="#3b82f6" />
                <g transform="translate(230, 20)">
                    <rect width="60" height="20" rx="4" fill="#3b82f6" />
                    <text x="30" y="13" font-size="9" fill="#fff" text-anchor="middle" font-weight="600">Confianza</text>
                </g>

                <!-- Verde -->
                <circle cx="280" cy="110" r="4" fill="#10b981" />
                <g transform="translate(245, 82)">
                    <rect width="60" height="20" rx="4" fill="#10b981" />
                    <text x="30" y="13" font-size="9" fill="#fff" text-anchor="middle" font-weight="600">Respeto</text>
                </g>
            </svg>

            <!-- Etiquetas del Eje X -->
            <div class="chart-axis-x">
                <span>Día 0</span>
                <span>Día 28</span>
            </div>
        </div>

        <p class="chart-footer-text">Estas habilidades se pueden aprender con nosotros</p>

        <a href="personalidad11.html" class="btn-primary">CONTINUAR</a>
    </main>
    <script src="../js/page-transitions.js" defer></script>

</body>
</html>
