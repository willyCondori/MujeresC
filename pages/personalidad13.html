<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crecimiento Personal - #MujeresConPoder</title>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/backNavigation.css">
</head>

<body class="page-container">

    <main class="main-card">

        <!-- Botón volver -->
        <a href="personalidad12.html" class="back-navigation-button" aria-label="Volver" title="Volver">

            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">

                <path d="M19 12H5"></path>
                <path d="M12 19l-7-7 7-7"></path>

            </svg>
        </a>

        <!-- Encabezado -->
        <div class="form-header">

            <h1>
                Completar formulario
                <br>
                <span class="highlight">#MujeresConPoder</span>
            </h1>

            <p class="header-description">
                Estás a un paso de decidir cómo potenciar tus habilidades,
                autoconfianza y respeto por ti misma.
            </p>

            <h2>
                ¿Tienes algún motivo concreto por el que te gustaría
                desarrollar tus habilidades de comunicación?
            </h2>

        </div>

        <!-- Selección única -->
        <div class="options-list">

            <label class="option-card">

                <span class="option-text">
                    Avanzar profesionalmente
                </span>

                <input type="radio" name="motivo-comunicacion" value="avanzar-profesionalmente" class="option-checkbox">

            </label>

            <label class="option-card">

                <span class="option-text">
                    Crear mi propia empresa
                </span>

                <input type="radio" name="motivo-comunicacion" value="crear-empresa" class="option-checkbox">

            </label>

            <label class="option-card">

                <span class="option-text">
                    Ampliar mis propias oportunidades
                </span>

                <input type="radio" name="motivo-comunicacion" value="ampliar-oportunidades" class="option-checkbox">

            </label>

            <label class="option-card">

                <span class="option-text">
                    Bienestar mental y emocional
                </span>

                <input type="radio" name="motivo-comunicacion" value="bienestar-mental-emocional"
                    class="option-checkbox">

            </label>

            <label class="option-card">

                <span class="option-text">
                    Crear nuevas amistades
                </span>

                <input type="radio" name="motivo-comunicacion" value="crear-amistades" class="option-checkbox">

            </label>

            <label class="option-card">

                <span class="option-text">
                    Otros objetivos personales
                </span>

                <input type="radio" name="motivo-comunicacion" value="otros-objetivos" class="option-checkbox">

            </label>

        </div>

        <!-- Continuar oculto: la selección avanza automáticamente -->
        <div class="form-footer" hidden>
            <a href="personalidad14.html" class="btn-primary" data-transition="up">
                CONTINUAR
            </a>

        </div>

    </main>

    <script src="../js/backNavigation.js" defer></script>
    <script src="../js/quizNavigation.js" defer></script>
    <script src="../js/pageTransitions.js" defer></script>

</body>

</html>
