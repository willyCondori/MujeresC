<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Ruta Generada - #MujeresConPoder</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="page-container">

    <!-- Contenedor principal tipo tarjeta móvil -->
    <div class="route-main-wrapper">

        <!-- Cabecera Morada -->
        <div class="route-header">
            <h1 class="route-header-title">
                ¡Felicidades!
            </h1>
            <p class="route-header-subtitle">
                Tu ruta está generada
            </p>
        </div>

        <!-- Cuerpo con contenido scrollable -->
        <div class="route-content-body">

            <!-- Tarjeta Flotante: Nivel Actual -->
            <div class="route-card-level">
                <span class="route-level-tag">
                    Nivel Actual
                </span>
                <h2 class="route-level-title">
                    1 - DESPERTAR
                </h2>
                <div class="route-level-badge">
                    🥇 "Reonozco mi valor"
                </div>

                <!-- Barra de Progreso de Puntos -->
                <div class="route-progress-track">
                    <!-- Indicador de progreso rojo/magenta -->
                    <div class="route-progress-fill"></div>
                    <!-- Punto indicador -->
                    <div class="route-progress-dot"></div>
                </div>

                <div class="route-progress-labels">
                    <span>0 pts</span>
                    <span class="route-progress-current" id="score-current">Tú (18)</span>
                    <span>48 pts</span>
                </div>
            </div>

            <!-- Sección: Tu contenido desbloqueado -->
            <div>
                <h3 class="route-section-title">
                    Tu contenido desbloqueado
                </h3>

                <!-- Lista de Contenidos -->
                <div class="route-items-list">

                    <!-- Item 1: Taller Magistral -->
                    <div class="route-item-card">
                        <div class="route-item-info">
                            <div class="route-icon-box bg-gray">
                                🎬
                            </div>
                            <div>
                                <h4 class="route-item-heading">Taller Magistral</h4>
                                <p class="route-item-desc">Introducción al...</p>
                            </div>
                        </div>
                        <a href="#" class="route-btn-action">
                            Ver
                        </a>
                    </div>

                    <!-- Item 2: PDF Descargable -->
                    <div class="route-item-card">
                        <div class="route-item-info">
                            <div class="route-icon-box bg-yellow">
                                📄
                            </div>
                            <div>
                                <h4 class="route-item-heading">PDF Descargable</h4>
                                <p class="route-item-desc">Guía: Mis primeros 7 pasos</p>
                            </div>
                        </div>
                        <a href="#" class="route-icon-link text-yellow">
                            📥
                        </a>
                    </div>

                    <!-- Item 3: Audio motivacional -->
                    <div class="route-item-card">
                        <div class="route-item-info">
                            <div class="route-icon-box bg-purple">
                                🎧
                            </div>
                            <div>
                                <h4 class="route-item-heading">Audio motivacional</h4>
                                <p class="route-item-desc">Meditación guiada · 8 min</p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>

    </div>

    <script src="../js/quizScore.js"></script>
    <script src="../js/scoreFinal.js"></script>

</body>

</html>
