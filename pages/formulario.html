<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar formulario - #MujeresConPoder</title>

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/formulario.css">
    <link rel="stylesheet" href="../css/backNavigation.css">

    <!-- CSS de intl-tel-input -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/css/intlTelInput.css">

    <!-- CSS de Select2 (ANTES de nuestro <style> para que no pise los estilos) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css">

    <style>
        /* ==========================================
           ESTILOS Y FIXES DEL FORMULARIO
           ========================================== */
        .main-card {
            height: auto !important;
            min-height: auto;
            max-height: none !important;
            overflow: visible !important;
            padding-bottom: 24px;
        }

        body.page-container,
        .page-container {
            height: auto !important;
            min-height: 100vh;
            overflow-y: auto !important;
        }

        .form-fields {
            flex-grow: 0 !important;
        }

        .page-container,
        .main-card,
        .form-fields,
        .form-field {
            overflow: visible !important;
        }

        /* Ajustes para intl-tel-input */
        .iti {
            width: 100%;
        }

        .iti__country-list {
            z-index: 9999 !important;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        /* Mensajes de error */
        .form-field.has-error input,
        .form-field.has-error select,
        .form-field.has-error .iti {
            border-color: #e53e3e !important;
            background-color: #fff5f5;
        }

        .form-field .field-error {
            color: #e53e3e;
            font-size: 12px;
            margin-top: 4px;
            display: block;
            font-weight: 500;
        }

        /* ==========================================
           SELECT2 ADAPTADO AL FORMULARIO
           ========================================== */
        .select2-container {
            width: 100% !important;
        }

        .select2-container--default .select2-selection--single {
            height: 52px;
            /* igualar a .form-input */
            border: 1px solid #d9d9d9;
            /* igualar a .form-input */
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 0 8px;
            background: #fff;
        }

        .select2-container--default .select2-selection--single .select2-selection__rendered {
            flex: 1;
            line-height: normal;
            padding-left: 8px;
            padding-right: 28px;
            color: inherit;
            font: inherit;
        }

        .select2-container--default .select2-selection--single .select2-selection__placeholder {
            color: #9aa0a6;
        }

        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 100%;
            right: 10px;
        }

        .select2-dropdown {
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .15);
        }

        .select2-search--dropdown .select2-search__field {
            border-radius: 8px;
            padding: 8px;
        }

        /* Deshabilitado (mientras carga o si no aplica) */
        .select2-container--default.select2-container--disabled .select2-selection--single {
            opacity: .6;
            cursor: not-allowed;
        }

        /* Estado de error */
        .form-field.has-error .select2-container--default .select2-selection--single {
            border-color: #e53e3e !important;
            background-color: #fff5f5;
        }
    </style>

    <!-- JS: jQuery -> Select2 -> intl-tel-input (sin defer, se cargan antes de formulario.js) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/i18n/es.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/intl-tel-input@18.2.1/build/js/intlTelInput.min.js"></script>
</head>

<body class="page-container">

    <main class="main-card">

        <a href="personalidad15.html" class="back-navigation-button" aria-label="Volver" title="Volver">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M19 12H5"></path>
                <path d="M12 19l-7-7 7-7"></path>
            </svg>
        </a>

        <div class="form-header">
            <h1>Completar <br>formulario</h1>
            <p class="form-subtitle highlight">#MujeresConPoder</p>
        </div>

        <p class="helper-text text-center">
            Hoy comienza tu transformación. Completa estos datos para tu certificado y nuestra
            comunicación permanente. Estamos deseosos de compartir tus resultados.
        </p>

        <form class="form-fields" id="formPerfil" novalidate>

            <!-- Nombre -->
            <div class="form-field">
                <input type="text" class="form-input" name="nombre" placeholder="Nombre completo" autocomplete="name"
                    required>
            </div>

            <!-- Correo -->
            <div class="form-field">
                <input type="email" class="form-input" name="correo" placeholder="Correo electrónico"
                    autocomplete="email" required>
            </div>

            <!-- WhatsApp -->
            <div class="form-field">
                <input type="number" class="form-input" name="whatsapp" id="whatsapp" placeholder="Número de WhatsApp"
                    inputmode="numeric" required>
            </div>

            <!-- País (se llena desde formulario.js y se sincroniza con la bandera del teléfono) -->
            <div class="form-field">
                <select class="form-input" name="pais" id="pais" required>
                    <option></option>
                </select>
            </div>

            <!-- Departamento / Estado / Provincia -->
            <div class="form-field">
                <select class="form-input" name="departamento" id="departamento" required disabled>
                    <option></option>
                </select>
            </div>

            <!-- Ciudad -->
            <div class="form-field">
                <select class="form-input" name="ciudad" id="ciudad" required disabled>
                    <option></option>
                </select>
            </div>

            <!-- Ocupación -->
            <div class="form-field">
                <select class="form-input" name="ocupacion" id="ocupacion" required>
                    <option></option>
                    <option value="empleada">Empleada</option>
                    <option value="profesional-dependiente">Profesional dependiente</option>
                    <option value="independiente">Trabajadora independiente</option>
                    <option value="empresaria">Empresaria</option>
                    <option value="emprendedora">Emprendedora</option>
                    <option value="comerciante">Comerciante</option>
                    <option value="estudiante">Estudiante</option>
                    <option value="ama-de-casa">Ama de casa</option>
                    <option value="otro">Otro</option>
                </select>
            </div>

        </form>

        <div class="form-footer">
            <button type="submit" form="formPerfil" class="btn-primary btn-submit">CONTINUAR</button>
        </div>

    </main>

    <!-- select2Init.js ya NO se usa: su lógica quedó integrada en formulario.js -->
    <script src="../js/formulario.js" defer></script>
    <script src="../js/pageTransitions.js" defer></script>
</body>

</html>
