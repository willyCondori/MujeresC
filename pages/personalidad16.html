<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creando tu plan - #MujeresConPoder</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/backNavigation.css">
    <link rel="stylesheet" href="../css/personalidad16.css">
</head>

<body class="page-container">

    <main class="main-card">
        <a href="personalidad15.html" class="back-navigation-button" aria-label="Volver" title="Volver">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M19 12H5"></path>
                <path d="M12 19l-7-7 7-7"></path>
            </svg>
        </a>
        <div class="form-header">
            <h1>Completar formulario <br><span class="highlight">#MujeresConPoder</span></h1>
            <h2> <span class="highlight">Creamos tu plan de crecimiento personal</span></h2>
        </div>

        <div class="status-list" id="analysis-container">
            <div class="status-item">
                <span class="status-text">Analizando respuestas</span>
                <div class="status-icon">
                    <div class="spinner"></div>
                    <span class="check">✓</span>
                </div>
            </div>
            <div class="status-item">
                <span class="status-text">Adaptándolo a los factores desencadenantes</span>
                <div class="status-icon">
                    <div class="spinner"></div>
                    <span class="check">✓</span>
                </div>
            </div>
            <div class="status-item">
                <span class="status-text">Fijando los objetivos</span>
                <div class="status-icon">
                    <div class="spinner"></div>
                    <span class="check">✓</span>
                </div>
            </div>
            <div class="status-item">
                <span class="status-text">Personalizando tu plan</span>
                <div class="status-icon">
                    <div class="spinner"></div>
                    <span class="check">✓</span>
                </div>
            </div>
        </div>

        <a href="formulario.html" id="continue-btn" class="btn-primary">CONTINUAR</a>
    </main>

    <script src="../js/backNavigation.js" defer></script>
    <script src="../js/pageTransitions.js" defer></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const items = document.querySelectorAll(".status-item");
            const continueBtn = document.getElementById("continue-btn");
            const stepDuration = 1200;

            items.forEach((item, index) => {

                // Activar paso
                setTimeout(() => {
                    item.classList.add("active");
                }, index * stepDuration);

                // Completar paso
                setTimeout(() => {
                    item.classList.remove("active");
                    item.classList.add("completed");

                    // Comprobar si TODOS están completados
                    const allCompleted = [...items].every(item =>
                        item.classList.contains("completed")
                    );

                    if (allCompleted) {
                        continueBtn.classList.add("ready");
                    }

                }, (index + 1) * stepDuration);
            });
        });
    </script>

</body>

</html>
