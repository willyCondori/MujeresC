<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimensión 2 - Voz y Participación (3) - #MujeresConPoder</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="page-container">

    <main class="main-card">
        
        <!-- Barra de progreso superior (Tercera barra activa) -->
        <div class="progress-bar-container">
            <div class="progress-step active"></div>
            <div class="progress-step active"></div>
            <div class="progress-step active"></div>
        </div>

        <!-- Etiqueta de la dimensión -->
        <div class="dimension-badge-wrapper">
            <span class="dimension-badge">
                Dimensión 2 — Voz y Participación
            </span>
        </div>

        <!-- Título de la pregunta -->
        <div class="form-header" style="margin-bottom: 20px;">
            <h2 class="form-header-title">
                ¿Te sientes cómoda hablando en público o defendiendo tus ideas?
            </h2>
        </div>

        <!-- Opciones de respuesta -->
        <div class="options-list">
            <label class="option-card-custom">
                <span class="option-text-normal">1 = Nunca</span>
                <input type="radio" name="voz_3" class="option-radio">
            </label>

            <label class="option-card-custom">
                <span class="option-text-normal">2 = A veces</span>
                <input type="radio" name="voz_3" class="option-radio">
            </label>

            <!-- Opción seleccionada por defecto -->
            <label class="option-card-custom selected">
                <span class="option-text-selected">3 = Frecuentemente</span>
                <input type="radio" name="voz_3" class="option-radio" checked>
            </label>

            <label class="option-card-custom">
                <span class="option-text-normal">4 = Siempre</span>
                <input type="radio" name="voz_3" class="option-radio">
            </label>
        </div>

        <!-- Botón de siguiente -->
        <a href="progreso2.html" class="btn-action-primary">
            Siguiente
        </a>
    </main>
    <script src="../js/page-transitions.js" defer></script>

</body>
</html>
