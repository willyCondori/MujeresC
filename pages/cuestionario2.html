<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregunta 2 - Dimensión 1 - #MujeresConPoder</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="page-container">

    <main class="main-card">
        
        <!-- Barra de progreso superior (Dos primeras barras activas) -->
        <div class="progress-bar-container">
            <div class="progress-step active"></div>
            <div class="progress-step active"></div>
            <div class="progress-step"></div>
        </div>

        <!-- Etiqueta de la dimensión -->
        <div class="dimension-badge-wrapper">
            <span class="dimension-badge">
                Dimensión 1 - Autoestima
            </span>
        </div>

        <!-- Título de la pregunta -->
        <div class="form-header" style="margin-bottom: 20px;">
            <h2 class="form-header-title">
                ¿Tomas decisiones importantes sin depender de la aprobación de otros?
            </h2>
        </div>

        <!-- Opciones de respuesta -->
        <div class="options-list">
            <label class="option-card-custom">
                <span class="option-text-normal">1 = Nunca</span>
                <input type="radio" name="pregunta_decisiones" class="option-radio" value = '1'>
            </label>

            <label class="option-card-custom">
                <span class="option-text-normal">2 = A veces</span>
                <input type="radio" name="pregunta_decisiones" class="option-radio" value = '2'>
            </label>

            <!-- Opción seleccionada por defecto -->
            <label class="option-card-custom">
                <span class="option-text-normal">3 = Frecuentemente</span>
                <input type="radio" name="pregunta_decisiones" class="option-radio" value = '3' checked >
            </label>

            <label class="option-card-custom">
                <span class="option-text-normal">4 = Siempre</span>
                <input type="radio" name="pregunta_decisiones" class="option-radio" value = '4'>
            </label>
        </div>

        <!-- Botón de siguiente -->
        <a href="cuestionario3.html" class="btn-action-primary">
            Siguiente
        </a>
    </main>
    <script src="../js/quiz-score.js" defer></script>
    <script src="../js/page-transitions.js" defer></script>

</body>
</html>
