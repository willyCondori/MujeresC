<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu plan está listo - #MujeresConPoder</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/chart.css">
</head>
<body class="page-container">

    <main class="main-card">
        <div class="form-header" style="margin-bottom: 10px;">
            <h1>Completar formulario <br><span class="highlight">#MujeresConPoder</span></h1>
            <h2 style="font-size: 20px; font-weight: 700; margin-top: 5px;">Tu plan de crecimiento está listo.</h2>
        </div>

        <!-- Contenedor del Gráfico Vectorial HTML/SVG de 4 Semanas -->
        <div class="chart-wrapper" style="margin: 5px 0;">
            <svg class="line-chart" viewBox="0 0 320 150" preserveAspectRatio="none">
                <!-- Curva de evolución de 4 semanas -->
                <path d="M 30 110 C 90 110, 120 50, 180 50 C 240 50, 260 40, 290 20" fill="none" stroke="#10b981" stroke-width="3" />

                <!-- Punto inicial (Ahora) -->
                <circle cx="30" cy="110" r="5" fill="#fff" stroke="#f97316" stroke-width="3" />
                <g transform="translate(15, 75)">
                    <rect width="45" height="20" rx="4" fill="#1f2937" />
                    <text x="22.5" y="13" font-size="9" fill="#fff" text-anchor="middle" font-weight="600">Ahora</text>
                </g>

                <!-- Punto final (Después de 4 semanas) -->
                <circle cx="290" cy="20" r="5" fill="#fff" stroke="#10b981" stroke-width="3" />
                <g transform="translate(240, 12)">
                    <rect width="85" height="20" rx="4" fill="#1f2937" />
                    <text x="42.5" y="13" font-size="9" fill="#fff" text-anchor="middle" font-weight="600">Después de 4 semanas</text>
                </g>
            </svg>

            <!-- Etiquetas del Eje X -->
            <div class="chart-axis-x" style="padding: 0 5px;">
                <span>Semana 1</span>
                <span>Semana 2</span>
                <span>Semana 3</span>
                <span>Semana 4</span>
            </div>
        </div>

        <div style="text-align: center; margin: 10px 0;">
            <p style="font-size: 11px; color: #6b7280; margin-bottom: 8px;">Rango de mejora (estos resultados pueden variar)</p>
            <p style="font-size: 12px; color: #1f2937; font-weight: 500; line-height: 1.4;">Para utilizar la aplicación, necesitas un smartphone Iphone o Android</p>
        </div>

        <a href="plan.html" class="btn-primary" style="margin-top: auto;">CONTINUAR</a>
    </main>
    <script src="../js/page-transitions.js" defer></script>

</body>
</html>
