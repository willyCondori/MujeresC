<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu plan está listo - #MujeresConPoder</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/backNavigation.css">

    <style>
        /* Ajustes inmediatos para reducir el tamaño del gráfico y su contenedor */
        .main-card:has(.chart-wrapper) .line-chart,
        .line-chart {
            height: 200px !important;
            min-height: 200 !important;
        }

        .main-card:has(.chart-wrapper) .chart-wrapper,
        .chart-wrapper {
            padding: 10px 10px 6px !important;
            margin: 4px 0 8px !important;
        }

        .main-card:has(.chart-wrapper) {
            height: auto !important;
            max-height: none !important;
            padding-top: 20px !important;
            padding-bottom: 20px !important;
        }

        .chart-wrapper::after {
            margin-top: 6px !important;
            padding: 4px 8px !important;
        }

        /* Ocultar pseudoelementos voluminosos si es necesario ajustar más espacio */
        .main-card:has(.chart-wrapper)::before {
            display: none !important;
        }
    </style>
</head>

<body class="page-container">

    <main class="main-card">
        <a href="personalidad17.html" class="back-navigation-button" aria-label="Volver" title="Volver">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M19 12H5"></path>
                <path d="M12 19l-7-7 7-7"></path>
            </svg>
        </a>

        <div class="form-header">
            <h1>Completar formulario <br><span class="highlight">#MujeresConPoder</span></h1>
            <h2>Tu plan de crecimiento está listo.</h2>
        </div>

        <!-- Contenedor del Gráfico Vectorial -->
        <div class="chart-wrapper">
            <svg class="line-chart" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid meet">
                <!-- Curva de evolución -->
                <path d="M 30 140 C 90 140, 120 80, 180 80 C 240 80, 260 65, 290 45" fill="none" stroke="#f97316" stroke-width="4" />

                <!-- Punto inicial (Ahora) -->
                <circle cx="30" cy="140" r="6" fill="#fff" stroke="#f1f5f9" stroke-width="3" />
                <g transform="translate(15, 95)">
                    <rect width="50" height="22" rx="6" fill="#1e293b" />
                    <text x="25" y="15" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">Ahora</text>
                </g>

                <!-- Punto final (Después de 4 semanas) -->
                <circle cx="290" cy="45" r="6" fill="#fff" stroke="#f1f5f9" stroke-width="3" />
                <g transform="translate(170, 10)">
                    <rect width="130" height="24" rx="6" fill="#1e293b" />
                    <text x="65" y="16" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">Después de 4 semanas</text>
                </g>
            </svg>

            <!-- Etiquetas del Eje X -->
            <div class="chart-axis-x">
                <span>Semana 1</span>
                <span>Semana 2</span>
                <span>Semana 3</span>
                <span>Semana 4</span>
            </div>

            <!-- Subetiqueta interna -->
            <div style="text-align: center; margin-top: 8px;">
                <span style="background: #f8fafc; padding: 4px 12px; border-radius: 12px; font-size: 11px; color: #64748b; font-weight: 600;">
                    Habilidades sociales • Confianza • Respeto
                </span>
            </div>
        </div>

        <div style="margin: 12px 0; text-align: center;">
            <p style="font-size: 12px; color: #a855f7; margin: 0 0 4px 0;">Rango de mejora (estos resultados pueden variar)</p>
            <p style="font-size: 13px; color: #1e293b; font-weight: 700; margin: 0;">Para utilizar la aplicación, necesitas un smartphone iPhone o Android</p>
        </div>

        <a href="plan.html" class="btn-primary">CONTINUAR</a>
    </main>

    <script src="../js/backNavigation.js" defer></script>
    <script src="../js/pageTransitions.js" defer></script>

</body>

</html>
